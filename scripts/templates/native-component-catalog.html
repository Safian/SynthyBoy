<!doctype html>
<html lang="hu">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SynthyBoy · UI-komponenstár</title>
<style>*{box-sizing:border-box}
body{margin:auto;max-width:{{SIZE:catalog.max_width}}px;padding:{{SIZE:catalog.page_padding}}vw;background:{{COLOR:catalog.background}};color:{{COLOR:catalog.text}};font:{{SIZE:font.body}}px/1.5 system-ui}
a{color:{{COLOR:catalog.link}}}
h1{font-size:clamp({{SIZE:catalog.title.min}}px,{{SIZE:catalog.title.fluid}}vw,{{SIZE:catalog.title.max}}px);margin-bottom:{{SIZE:catalog.title.margin_bottom}}em}
h2{margin:{{SIZE:catalog.section.margin_top}}em 0 {{SIZE:catalog.section.margin_bottom}}em;border-top:{{SIZE:stroke.hair}}px solid {{COLOR:catalog.divider}};padding-top:{{SIZE:catalog.section.padding_top}}em}
h3{margin:{{SIZE:catalog.card_title.margin_top}}em 0 {{SIZE:catalog.title.margin_bottom}}em}
h4{margin:{{SIZE:catalog.variant.margin_top}}em 0 {{SIZE:catalog.title.margin_bottom}}em}
p{margin:{{SIZE:catalog.paragraph.margin_top}}em 0 {{SIZE:catalog.paragraph.margin_bottom}}em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,{{SIZE:catalog.card.min_width}}px),1fr));gap:{{SIZE:catalog.card.gap}}px}
article{padding:{{SIZE:catalog.card.padding}}px;background:{{COLOR:catalog.card}};border-radius:{{SIZE:catalog.card.radius}}px;display:flex;flex-direction:column}
article.wide{grid-column:1/-1}
article img{width:100%;height:{{SIZE:catalog.hero.height}}px;object-fit:contain;background:{{COLOR:catalog.background}};border-radius:{{SIZE:radius.control}}px}
footer{font-size:{{SIZE:font.section}}px;color:{{COLOR:catalog.footer}};margin-top:auto;padding-top:{{SIZE:catalog.section.padding_top}}em}
li{break-inside:avoid}
ul{columns:2}
.swatches{display:flex;flex-direction:column;align-items:flex-start;gap:{{SIZE:catalog.swatch.gap}}em;margin:{{SIZE:catalog.swatch.gap}}em 0}
.swatch{display:inline-flex;align-items:center;gap:{{SIZE:catalog.swatch.label_gap}}em}
.swatch i{width:{{SIZE:catalog.swatch.side}}em;height:{{SIZE:catalog.swatch.side}}em;border:{{SIZE:stroke.hair}}px solid {{COLOR:catalog.swatch.border}};border-radius:{{SIZE:radius.tight}}px}
.swatch code{color:{{COLOR:catalog.code}}}
#meretek table{border-collapse:collapse;width:100%;max-width:{{SIZE:catalog.size_table.width}}px}
#meretek th,#meretek td{text-align:left;padding:{{SIZE:catalog.swatch.label_gap}}em {{SIZE:catalog.table.column_gap}}em {{SIZE:catalog.swatch.label_gap}}em 0;border-bottom:{{SIZE:stroke.hair}}px solid {{COLOR:catalog.divider}}}
.size-samples{display:flex;align-items:flex-start;gap:{{SIZE:catalog.samples.gap}}px;flex-wrap:wrap}
article table{border-collapse:collapse;margin:0.3em 0 0.8em}
article th,article td{border:1px solid #465064;padding:0.2em 0.7em;text-align:left}
.size-sample{margin:0}
.size-sample img{width:auto;height:auto;max-width:100%;border-radius:0}
.size-sample figcaption{margin-bottom:{{SIZE:catalog.samples.caption_gap}}px}
</style>
<main>
<h1>SynthyBoy UI-komponenstár</h1>
<nav aria-label="Katalógusok">
<a href="native-katalogus.html">SynthyBoy-fülek a natív átépítés előtt és után</a>
</nav>
<section id="meretek">
<h2>Méretek</h2>
{{NAMED_SIZES}}
</section>
<section id="szinpaletta">
<h2>Színpaletta</h2>
{{PALETTE}}
</section>
{{COMPONENTS}}
</main>
</html>
