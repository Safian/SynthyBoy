# What scripts/build-mpc.sh --plugin template-mpc needs to know about this plugin (migration step 12 of docs/ui-components/TEMPLATE.md): plain NAME=value lines, no quotes, no spaces inside a value.
# Paths are relative to this folder (MODULE and HELPER: to the CMake build tree of the architecture, CMAKE_SOURCE: to the repository).
TARGET=mpckit_demo                      # the CMake target of the plugin module
CMAKE_SOURCE=template-mpc               # the CMake source folder (its CMakeLists.txt is a project of its own: it needs only MPC_SDK_DIR)
CMAKE_ARGS=-DMPCKIT_OVERLAY=ON          # fixed arguments of the configure step: the plugin-drawn pages and the GPU helper (a Linux cross build)
MODULE=mpckit_demo.so                   # the module the target makes, in the build tree
BINARY_BASE=mpckitdemo                  # VST/mpckitdemo-arm32.so / -arm64.so: the names in package/plugin.json
HELPER=gpu-helper/mpckit-demo-overlay-gpu   # the GPU helper (built with MPCKIT_OVERLAY): VST/mpckit-demo-overlay-gpu-arm32 / -arm64 next to the module; kBranding.helperName of src/overlay_hook.h
MANIFEST=package/plugin.json            # the finished plugin.json (file32 / file64 are kept for the binaries that were built)
SKIN_SCRIPT=tools/gen_skin.py           # writes "Plugin Skins" into the package folder: gen_skin.py --out <package folder> --sdk <SDK>
