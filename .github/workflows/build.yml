# Copyright (C) 2026 Safian Szabolcs
#
# Builds VST3 + CLAP on Linux, macOS and Windows, runs the core tests (CTest), uploads the plugins as
# artifacts and runs pluginval (VST3) and clap-validator (CLAP). Further jobs: core tests under
# ASan/UBSan and TSan, core cross build + tests for Linux ARMv7 hard-float under QEMU, a native
# Linux AArch64 build, the plugin manifest check, and the Vital-free static library check (iOS rule).
# SYNTHYBOY_WITH_VITAL is ON by default, so every job except ios-vital-free builds and tests the Vital-derived engine
# (core/engine-vital) as well; the shipped plugin still uses the own engine.
#
# First GitHub run (2026-11-04): Linux and macOS green incl. pluginval; Windows failed only in the
# pluginval SHA-256 check (backslash prefix of Git-for-Windows sha256sum, fixed below).

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN: SynthyBoy
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_VERSION: 0.4.1

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      # actions are pinned by commit SHA (checkout v7.0.1, upload-artifact v7.0.2)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: scripts/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Core tests (ctest)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Core tests (ctest, Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CLAP smoke host (state / parameter round trip)
        if: runner.os != 'Windows'
        run: build/clap_smoke "build/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

      # docs/params.json (machine readable table, read by Kick's UI) and docs/PARAMETERS.md are generated from the parameter table
      # (synthyboy_paramdump + scripts/gen-params-doc.py); the committed files must equal the regenerated ones
      - name: Parameter documentation is up to date (docs/params.json, docs/PARAMETERS.md)
        if: runner.os == 'Linux'
        run: scripts/check-params-doc.sh build/tools/paramdump/synthyboy_paramdump

      # the same plugin with the Vital-derived engine (-DSYNTHYBOY_SHELL_ENGINE=vital); JUCE and clap-juce-extensions are
      # reused from the first build. clap_smoke checks silence, then audio after a note-on, and the state round trip.
      - name: Plugin with the Vital engine (CLAP smoke host)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-vital -G Ninja -DCMAKE_BUILD_TYPE=Release -DSYNTHYBOY_SHELL_ENGINE=vital -DSYNTHYBOY_BUILD_TESTS=OFF \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src" \
            -DFETCHCONTENT_SOURCE_DIR_CLAP-JUCE-EXTENSIONS="$PWD/build/_deps/clap-juce-extensions-src"
          cmake --build build-vital --target SynthyBoy_CLAP clap_smoke --parallel
          build-vital/clap_smoke "build-vital/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

      - name: Package
        run: |
          mkdir -p dist
          tar -C "build/${PLUGIN}_artefacts/Release" -czf "dist/${PLUGIN}-${RUNNER_OS}.tar.gz" VST3 CLAP
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.PLUGIN }}-${{ runner.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

      # pluginval is downloaded from the official Tracktion/pluginval release and verified
      # against the SHA-256 recorded when this workflow was written.
      - name: pluginval (VST3)
        run: |
          case "$RUNNER_OS" in
            Linux)   asset=pluginval_Linux.zip;   sha=c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352; exe=pluginval ;;
            macOS)   asset=pluginval_macOS.zip;   sha=3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f; exe=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) asset=pluginval_Windows.zip; sha=c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab; exe=pluginval.exe ;;
          esac
          tools="$RUNNER_TEMP/pluginval"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/$asset" "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${asset}"
          if command -v sha256sum >/dev/null; then actual=$(sha256sum "$tools/$asset" | cut -d' ' -f1); else actual=$(shasum -a 256 "$tools/$asset" | cut -d' ' -f1); fi
          # Git-for-Windows sha256sum prefixes the hash with a backslash when the file name contains one
          actual="${actual#\\}"
          [ "$actual" = "$sha" ] || { echo "SHA-256 mismatch for $asset: $actual"; exit 1; }
          (cd "$tools" && cmake -E tar xf "$asset")
          chmod +x "$tools/$exe" || true
          vst3="build/${PLUGIN}_artefacts/Release/VST3/${PLUGIN}.vst3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$tools/$exe" --strictness-level 5 --validate "$vst3"
          else
            "$tools/$exe" --strictness-level 5 --validate "$vst3"
          fi

      # clap-validator is built from source (tagged release) with cargo. Blocking since the run
      # where it reported 0 failed tests on Linux, macOS and Windows (2026-11-04).
      - name: clap-validator (CLAP)
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag "${CLAP_VALIDATOR_VERSION}" clap-validator
          clap-validator validate "build/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate plugin.json against schema/plugin-manifest.schema.json
        run: python3 -I scripts/check-manifest.py

  # The core (no JUCE) with sanitizers: ASan + UBSan, and TSan (audio thread vs. parameter thread).
  core-sanitizers:
    name: core tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          - name: tsan
            flags: -fsanitize=thread -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          # the sanitizer runtimes need a lower ASLR entropy than the runner's default
          sudo sysctl vm.mmap_rnd_bits=28 || true

      - name: Configure
        run: |
          cmake -S . -B build-san -G Ninja -DSYNTHYBOY_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build-san --parallel

      - name: Run tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure

  # Linux ARMv7 hard-float (MPC Key 61 class): cross build of the core, tests run under QEMU user mode.
  # Timing is not measured here (QEMU); only correctness and the ABI of the produced binaries.
  core-armv7:
    name: core tests (linux-armv7, qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-arm-linux-gnueabihf gcc-arm-linux-gnueabihf qemu-user

      - name: Configure
        run: |
          cmake -S . -B build-armv7 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/armv7-linux-gnueabihf.cmake \
            -DSYNTHYBOY_BUILD_PLUGIN=OFF \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-arm;-L;/usr/arm-linux-gnueabihf"

      - name: Build
        run: cmake --build build-armv7 --parallel

      - name: ABI of the produced binaries
        run: |
          bin=build-armv7/core/tests/synthyboy_test_engine
          file "$bin"
          arm-linux-gnueabihf-readelf -A "$bin"

      - name: Run tests (QEMU user mode)
        run: ctest --test-dir build-armv7 --output-on-failure

      # Statically linked benchmark for the Akai MPC (see docs/MPC-BENCH-REQUEST.md): no dependency on the
      # device's glibc/libstdc++. Only a smoke run under QEMU here; QEMU timings mean nothing.
      - name: Static benchmark binary (ARMv7 hard-float)
        run: |
          cmake -S . -B build-armv7-bench -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/armv7-linux-gnueabihf.cmake \
            -DSYNTHYBOY_BUILD_PLUGIN=OFF -DSYNTHYBOY_BUILD_TESTS=ON \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-armv7-bench --target synthyboy_bench --parallel
          bin=build-armv7-bench/bench/synthyboy_bench
          file "$bin"
          arm-linux-gnueabihf-readelf -A "$bin" | grep -E "Tag_CPU_arch:|Tag_FP_arch|Tag_Advanced_SIMD"
          qemu-arm "$bin" --engine own --seconds 1
          mkdir -p dist-bench && cp "$bin" dist-bench/synthyboy_bench-armv7 && (cd dist-bench && sha256sum synthyboy_bench-armv7 | tee SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthyboy-bench-armv7
          path: dist-bench/*
          if-no-files-found: error

  # Native Linux AArch64 build of everything on GitHub's arm runner (no pluginval here).
  linux-aarch64:
    name: linux-aarch64
    runs-on: ubuntu-24.04-arm
    env:
      PLUGIN: SynthyBoy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Build
        run: scripts/build.sh

      - name: Core tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: CLAP smoke host (state / parameter round trip)
        run: build/clap_smoke "build/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

      # informational: prints the real-time factor and block times of the Vital engine on the runner's cores (shared
      # cloud machine, not an MPC or phone number); nothing is asserted
      - name: Benchmark (Vital engine, informational)
        run: |
          build/bench/synthyboy_bench --engine vital --seconds 5
          build/bench/synthyboy_bench --engine own --seconds 5

  # The iOS rule (docs/ARCHITECTURE.md 2.2): with SYNTHYBOY_WITH_VITAL=OFF nothing Vital-derived is built or linked. The
  # core library is built without the engine-vital directory in the build at all, its tests run (own engine), and the
  # static library is searched for objects, symbols and strings of the Vital-derived code. The script tests itself.
  ios-vital-free:
    name: Vital-free core library (iOS rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure (SYNTHYBOY_WITH_VITAL=OFF)
        run: |
          cmake -S . -B build-novital -G Ninja -DSYNTHYBOY_BUILD_PLUGIN=OFF -DSYNTHYBOY_WITH_VITAL=OFF -DCMAKE_BUILD_TYPE=Release
          test ! -e build-novital/core/engine-vital

      - name: Build synthyboy_core and the tests
        run: cmake --build build-novital --parallel

      - name: Core tests (ctest)
        run: ctest --test-dir build-novital --output-on-failure

      - name: No Vital-derived object, symbol or string in libsynthyboy_core.a
        run: scripts/check-no-vital.sh build-novital/core/libsynthyboy_core.a

      - name: The check fails on a library that contains Vital-derived code (self-test)
        run: scripts/check-no-vital.sh --self-test
