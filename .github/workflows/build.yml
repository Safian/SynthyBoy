# Copyright (C) 2026 Safian Szabolcs
#
# Builds VST3 + CLAP on Linux, macOS and Windows, runs the core tests (CTest), uploads the plugins as
# artifacts and runs pluginval (VST3) and clap-validator (CLAP). Further jobs: core tests (incl. the fuzz smoke and the factory
# preset gate) under ASan/UBSan and TSan, the GUI tests under ASan/UBSan, core cross build + tests for Linux ARMv7 hard-float under QEMU, a native
# Linux AArch64 build, the plugin manifest check, and the Vital-free static library check (iOS rule), and the iOS SDK build of the static library with the bitmap GUI (JUCE 8 in its own namespace, tested in the
# iOS simulator and next to JUCE 7).
# The native module synthyboy.clap carries the bitmap GUI (docs/BITMAP-GUI-EXTENSION.md): its tests (tests/bitmap-gui: a host without JUCE that loads the built .clap, golden images, the export
# list of the module) run in the build job; the GUI tests also run under ASan + UBSan and under TSan, and the ARMv7 module is built and tested under QEMU in the bitmap-gui-armv7 job.
# SYNTHYBOY_WITH_VITAL is ON by default, so every job except ios-vital-free builds and tests the Vital-derived engine
# (core/engine-vital) as well; the shipped plugin uses it (the own engine is the fallback and the engine of Vital-free builds).
#
# First GitHub run (2026-11-04): Linux and macOS green incl. pluginval; Windows failed only in the
# pluginval SHA-256 check (backslash prefix of Git-for-Windows sha256sum, fixed below).

name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'   # nightly: the slow jobs (see HEAVY below) run for every branch state of main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN: SynthyBoy
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_VERSION: 0.4.1

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      # actions are pinned by commit SHA (checkout v7.0.1, upload-artifact v7.0.2)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth openbox \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: scripts/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Core tests (ctest)
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure -LE audit

      # The GUI tests open real (temporary) desktop windows: Linux needs an X server and a window manager (JUCE sets EWMH atoms; a bare Xvfb
      # answers BadAtom). The software-only tests do not care.
      - name: Core tests (ctest, Linux under Xvfb + openbox)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & sleep 2; ctest --test-dir build --output-on-failure -LE audit'

      - name: Core tests (ctest, Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure -LE audit

      - name: CLAP smoke host (default engine, parameter parity, audio, state round trip)
        if: runner.os != 'Windows'
        run: build/clap_smoke "build/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

      # docs/params.json (machine readable table, read by Kick's UI) and docs/PARAMETERS.md are generated from the parameter table
      # (synthyboy_paramdump + scripts/gen-params-doc.py); the committed files must equal the regenerated ones
      - name: Parameter documentation is up to date (docs/params.json, docs/PARAMETERS.md)
        if: runner.os == 'Linux'
        run: scripts/check-params-doc.sh build/tools/paramdump/synthyboy_paramdump

      # the same plugin with the own engine (-DSYNTHYBOY_SHELL_ENGINE=own, the fallback and the engine of Vital-free builds); JUCE and
      # clap-juce-extensions are reused from the first build. clap_smoke checks parity of every parameter, silence, audio after a
      # note-on, a fuzz of all parameters, the state round trip and the migration of the spike's state.
      - name: Plugin with the own engine (CLAP smoke host)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-own -G Ninja -DCMAKE_BUILD_TYPE=Release -DSYNTHYBOY_SHELL_ENGINE=own -DSYNTHYBOY_BUILD_TESTS=OFF \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src" \
            -DFETCHCONTENT_SOURCE_DIR_CLAP-JUCE-EXTENSIONS="$PWD/build/_deps/clap-juce-extensions-src"
          cmake --build build-own --target SynthyBoy_CLAP clap_smoke --parallel
          build-own/clap_smoke "build-own/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

      - name: Package
        run: |
          mkdir -p dist
          tar -C "build/${PLUGIN}_artefacts/Release" -czf "dist/${PLUGIN}-${RUNNER_OS}.tar.gz" VST3 CLAP
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.PLUGIN }}-${{ runner.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

      # pluginval is downloaded from the official Tracktion/pluginval release and verified
      # against the SHA-256 recorded when this workflow was written.
      - name: pluginval (VST3)
        run: |
          case "$RUNNER_OS" in
            Linux)   asset=pluginval_Linux.zip;   sha=c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352; exe=pluginval ;;
            macOS)   asset=pluginval_macOS.zip;   sha=3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f; exe=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) asset=pluginval_Windows.zip; sha=c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab; exe=pluginval.exe ;;
          esac
          tools="$RUNNER_TEMP/pluginval"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/$asset" "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${asset}"
          if command -v sha256sum >/dev/null; then actual=$(sha256sum "$tools/$asset" | cut -d' ' -f1); else actual=$(shasum -a 256 "$tools/$asset" | cut -d' ' -f1); fi
          # Git-for-Windows sha256sum prefixes the hash with a backslash when the file name contains one
          actual="${actual#\\}"
          [ "$actual" = "$sha" ] || { echo "SHA-256 mismatch for $asset: $actual"; exit 1; }
          (cd "$tools" && cmake -E tar xf "$asset")
          chmod +x "$tools/$exe" || true
          vst3="build/${PLUGIN}_artefacts/Release/VST3/${PLUGIN}.vst3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$tools/$exe" --strictness-level 5 --validate "$vst3"
          else
            "$tools/$exe" --strictness-level 5 --validate "$vst3"
          fi

      # clap-validator is built from source (tagged release) with cargo. Blocking since the run
      # where it reported 0 failed tests on Linux, macOS and Windows (2026-11-04).
      - name: clap-validator (CLAP)
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag "${CLAP_VALIDATOR_VERSION}" clap-validator
          clap-validator validate "build/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

  # The parameter effect audit (docs/ui-design/PARAM-AUDIT-REPORT.md, scripts/run-param-audit.sh): does the sound change, and the way it should, when a value changes?
  # The quick run (representative values of every key + the modulation sweep) against the committed baseline, the semantic checks and the mutation self test; a core only build
  # (no plug-in), in parallel to the build matrix. The quick run is about 4000 CPU seconds: it is divided over eight machines (--part I/8: a hash of the key name without the instance
  # number, so that the instances of a family stay together), share 0 also runs the semantic checks and the mutation self test. The full run (every value of every key) is
  # `scripts/run-param-audit.sh --full` (hours). docs/QUALITY.md "Parameter effect audit".
  param-audit:
    name: parameter effect audit (quick, share ${{ matrix.part }} of 8)
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'   # HEAVY: not on every develop / branch push (hours under sanitizers / QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Quick audit, share ${{ matrix.part }} of 8
        run: |
          cmake -S . -B build-audit -G Ninja -DSYNTHYBOY_BUILD_PLUGIN=OFF -DSYNTHYBOY_BITMAP_GUI=OFF
          if [ "${{ matrix.part }}" = 0 ]; then extra=""; else extra="--no-semantics"; fi
          scripts/run-param-audit.sh --quick --build-dir build-audit --jobs 4 --part "${{ matrix.part }}/8" $extra
      - name: Mutation self test
        if: matrix.part == 0
        run: scripts/run-param-audit.sh --self-test --no-build --build-dir build-audit
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: param-audit-report-${{ matrix.part }}
          path: build-audit/param-audit/latest/

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate plugin.json against schema/plugin-manifest.schema.json
        run: python3 -I scripts/check-manifest.py

  # The core (no JUCE) with sanitizers: ASan + UBSan, and TSan (audio thread vs. parameter thread).
  core-sanitizers:
    name: core tests (${{ matrix.name }})
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'   # HEAVY: not on every develop / branch push (hours under sanitizers / QEMU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          - name: tsan
            flags: -fsanitize=thread -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          # the sanitizer runtimes need a lower ASLR entropy than the runner's default
          sudo sysctl vm.mmap_rnd_bits=28 || true

      - name: Configure
        run: |
          cmake -S . -B build-san -G Ninja -DSYNTHYBOY_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build-san --parallel

      # the audio quality gates (label `slow`, about 25 s native) run under ASan + UBSan; ThreadSanitizer skips them: that executable is single
      # threaded (the thread test is what TSan is for) and would take minutes. LeakSanitizer is on (ASan default on Linux): the leak it found in
      # the Convolve module was real and is fixed, there is no suppression file. The tests are built with the sanitizer, so sbtest::instrumented ()
      # is true by itself (reduced workload of the thread / engine tests, no wall clock budgets): see "CI: what runs where" in docs/QUALITY.md.
      - name: Run tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          if [ "${{ matrix.name }}" = "tsan" ]; then exclude="-LE slow"; else exclude=""; fi
          ctest --test-dir build-san --output-on-failure $exclude

  # The GUI tests (real Components on the real processor, no window and no display needed) with ASan + UBSan: the plugin build, only the UI
  # test targets. Leak detection is off here: JUCE keeps process-lifetime singletons that LeakSanitizer reports; the core job above keeps it on.
  ui-sanitizers:
    name: GUI tests (asan-ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev
          sudo sysctl vm.mmap_rnd_bits=28 || true

      - name: Configure
        run: |
          cmake -S . -B build-ui-san -G Ninja -DSYNTHYBOY_BUILD_PLUGIN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build the GUI tests
        run: |
          cmake --build build-ui-san --parallel --target synthyboy_test_ui_model synthyboy_test_ui_render \
            synthyboy_test_ui_panels synthyboy_test_glb synthyboy_test_fx \
            synthyboy_clap synthyboy_test_bitmap_gui synthyboy_test_bitmap_golden

      - name: Run the GUI tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          SYNTHYBOY_UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-shots
        run: ctest --test-dir build-ui-san --output-on-failure -R 'synthyboy_test_(ui_model|ui_render|ui_panels|glb|fx|bitmap_gui|bitmap_golden)$'

  # The bitmap GUI of the native module (UI thread of the host against the audio thread, the toolkit's timer thread) under ThreadSanitizer: the module and the host harness only.
  bitmap-gui-tsan:
    name: bitmap GUI (tsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev
          sudo sysctl vm.mmap_rnd_bits=28 || true

      - name: Configure
        run: |
          cmake -S . -B build-bg-tsan -G Ninja -DSYNTHYBOY_BUILD_PLUGIN=OFF -DSYNTHYBOY_BITMAP_GUI=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-bg-tsan --parallel --target synthyboy_clap synthyboy_test_bitmap_gui

      - name: Run the bitmap GUI tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-bg-tsan --output-on-failure -R 'synthyboy_test_bitmap_gui$'

  # The ARMv7 hard-float module of the Akai MPC with the bitmap GUI: cross built in the Debian 12 container of scripts/build-armv7-clap.sh (JUCE sources and the helper tool are
  # fetched / built in the container), NEEDED libraries and export list checked, the test hosts of tests/bitmap-gui run against it under qemu-user in the same container. Timing under
  # QEMU means nothing (the tests scale their waits); it is correctness and the dependency list that count here.
  bitmap-gui-armv7:
    name: bitmap GUI (linux-armv7, qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build the module and run the test hosts under QEMU
        run: scripts/build-armv7-clap.sh --jobs "$(nproc)" --run-tests --out build-armv7-clap/synthyboy.clap

  # Linux ARMv7 hard-float (MPC Key 61 class): cross build of the core, tests run under QEMU user mode.
  # Timing is not measured here (QEMU); only correctness and the ABI of the produced binaries.
  core-armv7:
    name: core tests (linux-armv7, qemu)
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'   # HEAVY: not on every develop / branch push (hours under sanitizers / QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-arm-linux-gnueabihf gcc-arm-linux-gnueabihf qemu-user

      - name: Configure
        run: |
          cmake -S . -B build-armv7 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/armv7-linux-gnueabihf.cmake \
            -DSYNTHYBOY_BUILD_PLUGIN=OFF \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-arm;-L;/usr/arm-linux-gnueabihf"

      - name: Build
        run: cmake --build build-armv7 --parallel

      - name: ABI of the produced binaries
        run: |
          bin=build-armv7/core/tests/synthyboy_test_engine
          file "$bin"
          arm-linux-gnueabihf-readelf -A "$bin"

      # Only the fast subset under QEMU: the audio quality gates (label `slow`, about 25 s native, QEMU is 20 to 50 times slower, that is
      # more than 10 minutes) run natively on x86_64 (build job, sanitizers) and AArch64 (linux-aarch64 job). Everything else runs here.
      # SBTEST_INSTRUMENTED=1 (core/tests/test_runner.h, sbtest::instrumented ()): the emulator is 20 to 50 times slower, so the thread / engine tests that
      # scale their workload run the reduced one and the wall clock budget of fxinstances_rt (a speed gate, meaningless under QEMU) is not asserted; the
      # native jobs (macOS, Windows, Linux x86_64, AArch64) assert it.
      - name: Run tests (QEMU user mode, without the slow audio gates)
        env:
          SBTEST_INSTRUMENTED: "1"
        run: ctest --test-dir build-armv7 --output-on-failure -LE slow

      # Statically linked benchmark for the Akai MPC (see docs/MPC-BENCH-REQUEST.md): no dependency on the
      # device's glibc/libstdc++. Only a smoke run under QEMU here; QEMU timings mean nothing.
      - name: Static benchmark binary (ARMv7 hard-float)
        run: |
          cmake -S . -B build-armv7-bench -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/armv7-linux-gnueabihf.cmake \
            -DSYNTHYBOY_BUILD_PLUGIN=OFF -DSYNTHYBOY_BUILD_TESTS=ON \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-armv7-bench --target synthyboy_bench --parallel
          bin=build-armv7-bench/bench/synthyboy_bench
          file "$bin"
          arm-linux-gnueabihf-readelf -A "$bin" | grep -E "Tag_CPU_arch:|Tag_FP_arch|Tag_Advanced_SIMD"
          qemu-arm "$bin" --engine own --seconds 1
          mkdir -p dist-bench && cp "$bin" dist-bench/synthyboy_bench-armv7 && (cd dist-bench && sha256sum synthyboy_bench-armv7 | tee SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthyboy-bench-armv7
          path: dist-bench/*
          if-no-files-found: error

  # Native Linux AArch64 build of everything on GitHub's arm runner (no pluginval here).
  linux-aarch64:
    name: linux-aarch64
    runs-on: ubuntu-24.04-arm
    env:
      PLUGIN: SynthyBoy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth openbox \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Build
        run: scripts/build.sh

      - name: Core tests (ctest under Xvfb + openbox, the GUI tests open desktop windows)
        run: |
          xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & sleep 2; ctest --test-dir build --output-on-failure -LE audit'

      - name: CLAP smoke host (state / parameter round trip)
        run: build/clap_smoke "build/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

      # informational: prints the real-time factor and block times of the Vital engine on the runner's cores (shared
      # cloud machine, not an MPC or phone number); nothing is asserted
      - name: Benchmark (Vital engine, informational)
        run: |
          build/bench/synthyboy_bench --engine vital --seconds 5
          build/bench/synthyboy_bench --engine own --seconds 5

  # The iOS rule (docs/ARCHITECTURE.md 2.2): with SYNTHYBOY_WITH_VITAL=OFF nothing Vital-derived is built or linked. The
  # core library is built without the engine-vital directory in the build at all, its tests run (own engine), and the
  # static library is searched for objects, symbols and strings of the Vital-derived code. The script tests itself.
  ios-vital-free:
    name: Vital-free core library (iOS rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure (SYNTHYBOY_WITH_VITAL=OFF)
        run: |
          cmake -S . -B build-novital -G Ninja -DSYNTHYBOY_BUILD_PLUGIN=OFF -DSYNTHYBOY_WITH_VITAL=OFF -DCMAKE_BUILD_TYPE=Release
          test ! -e build-novital/core/engine-vital

      - name: Build synthyboy_core and the tests
        run: cmake --build build-novital --parallel

      - name: Core tests (ctest)
        run: ctest --test-dir build-novital --output-on-failure

      - name: No Vital-derived object, symbol or string in static libraries (iOS rule)
        run: scripts/check-no-vital.sh build-novital/core/libsynthyboy_core.a build-novital/shell-clap/libsynthyboy_static.a

      - name: The check fails on a library that contains Vital-derived code (self-test)
        run: scripts/check-no-vital.sh --self-test

      - name: The own-engine table of the UI is up to date (docs/ui-design/OWN-ENGINE-GAP.md)
        run: python3 scripts/gen-own-engine-gap.py build-novital/tools/paramdump/synthyboy_paramdump --check

  # The static library of the bitmap GUI for the iOS SDK (docs/ARCHITECTURE.md 4.3, docs/BITMAP-GUI-EXTENSION.md section 14): SYNTHYBOY_STATIC_UI=ON, own engine (SYNTHYBOY_WITH_VITAL=OFF), JUCE 8 in the namespace
  # synthyboy_juce8, one partial link that leaves synthyboy_clap_get_entry as the only exported symbol. scripts/test-ios-static-ui.sh builds it, checks the symbols and the Vital rule (scripts/check-no-vital.sh
  # over the library and every archive it links: the iOS rule stays in force with the UI in), runs the tests of the bitmap GUI IN the iOS simulator, and links the library with the real JUCE 7.0.12 (pinned
  # tag, the version of the Kick app) linked whole into one test program that is run too. A second configuration builds the device library (arm64); a third the simulator library for arm64 + x86_64.
  ios-static-ui:
    name: Static UI library for the iOS SDK (JUCE 8 next to JUCE 7)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: command -v ninja >/dev/null || brew install ninja

      - name: JUCE 7.0.12 (the JUCE of the Kick app; test stand-in)
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git juce7

      - name: Simulator build, symbols, Vital rule, tests in the iOS simulator, JUCE 7 next to it
        run: scripts/test-ios-static-ui.sh --sdk iphonesimulator --archs arm64 --build-dir build-ios-sim --juce7 "$PWD/juce7"

      - name: Device build (arm64), symbols, Vital rule, link next to JUCE 7
        run: scripts/test-ios-static-ui.sh --sdk iphoneos --archs arm64 --build-dir build-ios-device --juce7 "$PWD/juce7"

      - name: Simulator build for arm64 + x86_64 (compile and link)
        run: scripts/test-ios-static-ui.sh --sdk iphonesimulator --archs "arm64;x86_64" --no-run --build-dir build-ios-sim-universal --juce7 "$PWD/juce7"
